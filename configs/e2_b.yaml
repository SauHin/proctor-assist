# E2: landmark features and a GRU over a window, protocol B (docs/decisions.md D32).
# All values equal configs/e2_a.yaml. Only the name and the protocol differ. A test checks this.
# Give the fold on the command line: --fold 1 to --fold 4.
name: e2_b
model: e2            # the GRU of E1 over the landmark features of a 3 s window (D32)
features: landmarks  # face, hand, and body points, normalized to the shoulders (owner decision, D32)
feature_size: 135    # values per frame, landmarks.N_FEATURES
hidden: 64           # units of the GRU layer
protocol: b          # cross-validation folds, with actors and real exam takers in each fold (D15)
seed: 0

# From the reference paper (Educ. Sci. 2023, section 3.4 and Table 1).
epochs: 20           # maximum number of epochs
patience: 10         # early stopping
batch_size: 16       # best value in Table 2 of the paper
lr: 0.0001           # Adam

# The same choice as for P1 (D21). E2 has no augmentation, as E1.
balanced_sampling: true   # each class has the same chance in a batch (owner decision)
